{% extends 'base.html' %}
{% block title %}Rejoindre la fidélité — {{ resto.name }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow-sm border-0">
            <div class="card-body p-4 text-center">
                <div class="fs-1">🍽️</div>
                <h2 class="mt-2">{{ resto.name }}</h2>
                <p class="text-muted">Programme de fidélité — gagne des récompenses à chaque visite !</p>
                <div class="alert alert-light border">
                    <strong>{{ resto.reward_threshold }} points</strong> = {{ resto.reward_description }}
                </div>
                <form method="POST" class="text-start mt-3">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <div class="mb-3">
                        <label class="form-label fw-bold">Ton adresse email</label>
                        <input type="email" name="email" class="form-control form-control-lg" placeholder="exemple@email.com" required autofocus>
                    </div>
                    <button type="submit" class="btn hera-btn-gold btn-lg w-100 fw-bold">
                        Continuer →
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
