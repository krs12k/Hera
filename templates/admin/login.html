<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>hera admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark d-flex align-items-center justify-content-center" style="min-height:100vh">
    <div class="card border-0 shadow p-4" style="width:340px">
        <h4 class="text-center mb-4 fw-bold">hera admin</h4>
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="alert alert-{{ category }}">{{ message }}</div>
            {% endfor %}
        {% endwith %}
        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="mb-3">
                <input type="password" name="password" class="form-control" placeholder="Mot de passe admin" required autofocus>
            </div>
            <button type="submit" class="btn btn-dark w-100">Entrer</button>
        </form>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
